org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# SDK Maven 坐标。正式发布时通过 CI 的 -P 参数覆盖版本和仓库凭据。
mapFusionGroup=com.mapfusion
mapFusionVersion=0.9.0-SNAPSHOT

# 正式仓库发布时设置 -PmapFusionRequirePublicationMetadata=true，并从 CI 注入 POM
# 元数据与 PGP 密钥。密钥也可使用 MAP_FUSION_SIGNING_KEY / PASSWORD 环境变量，
# 仓库凭据可使用 MAP_FUSION_REPOSITORY_USERNAME / PASSWORD 环境变量。
