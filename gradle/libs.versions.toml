# ==============================================================================
# Map Fusion 统一依赖版本目录 (Version Catalog)
# 集中管理全项目 Gradle 插件、AndroidX、协程、高德/百度官方 SDK 与测试依赖版本。
# ==============================================================================

[versions]
# 构建工具与核心语言版本
agp = "8.13.0"
kotlin = "2.4.21"
bcv = "0.18.1"

# AndroidX 与协程基础库版本（保持 minSdk 21 与 compileSdk 36 兼容）
coreKtx = "1.17.0"
activityKtx = "1.10.1"
lifecycle = "2.8.7"
coroutines = "1.9.0"
appcompat = "1.7.1"
constraintlayout = "2.2.2"
recyclerview = "1.4.0"
cardview = "1.0.0"
viewpager = "1.1.0"
legacySupportCoreUi = "1.0.0"

# 高德地图与官方导航合包版本（定位算法依赖 jafama）
amapMap = "11.2.000_loc11.2.000_sea9.8.0"
amapNavi = "11.2.000_3dmap11.2.000_loc11.2.000_sea9.8.0"
jafama = "2.3.2"

# 百度地图、定位、检索与官方导航版本
# 注意：Map-AllNavi 锁定 8.1.0（携带 ABI 匹配的 base/bwnavi 8.1 与 carnavi 8.0.1 引擎）
baiduMap = "8.2.0"
baiduMapAllNavi = "8.1.0"
baiduSearch = "8.2.0"
baiduLocation = "9.6.8"
baiduBnGlide = "1.0.1"
baiduNaviTts = "3.2.13"

# 百度官方导航与定位运行时传递依赖版本
glide = "4.12.0"
lottie = "6.7.1"
fresco = "3.7.0"
okhttp = "4.12.0"
gson = "2.11.0"

# 单元测试与设备端仪器测试版本
junit = "4.13.2"
archCoreTesting = "2.2.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRules = "1.7.0"
# maps 变体的测试 APK 继承 minSdk 21；uiautomator 2.4.0 要求 minSdk 23，因此锁定 2.3.0
uiautomator = "2.3.0"

[libraries]
# AndroidX 核心与生命周期组件
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version.ref = "viewpager" }
androidx-legacy-support-core-ui = { module = "androidx.legacy:legacy-support-core-ui", version.ref = "legacySupportCoreUi" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# 高德官方 SDK 及运行时依赖
amap-map-location-search = { module = "com.amap.api:3dmap-location-search", version.ref = "amapMap" }
amap-navi-map-location-search = { module = "com.amap.api:navi-3dmap-location-search", version.ref = "amapNavi" }
jafama = { module = "net.jafama:jafama", version.ref = "jafama" }

# 百度官方 SDK 及运行时依赖
baidu-map = { module = "com.baidu.lbsyun:BaiduMapSDK_Map", version.ref = "baiduMap" }
baidu-map-allnavi = { module = "com.baidu.lbsyun:BaiduMapSDK_Map-AllNavi", version.ref = "baiduMapAllNavi" }
baidu-search = { module = "com.baidu.lbsyun:BaiduMapSDK_Search", version.ref = "baiduSearch" }
baidu-location = { module = "com.baidu.lbsyun:BaiduMapSDK_Location_All", version.ref = "baiduLocation" }
baidu-bnglide = { module = "com.baidu.lbsyun:BNGlide4", version.ref = "baiduBnGlide" }
baidu-navitts = { module = "com.baidu.lbsyun:NaviTts", version.ref = "baiduNaviTts" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
fresco = { module = "com.facebook.fresco:fresco", version.ref = "fresco" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# 测试依赖
junit = { module = "junit:junit", version.ref = "junit" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "archCoreTesting" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
